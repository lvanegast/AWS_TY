services:
  catalog-api:
    build: .
    container_name: catalog-api-service
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PORT=8080
    networks:
      - aws-local-net

networks:
  aws-local-net:
    external: true
