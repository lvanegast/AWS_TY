services:
  localstack:
    container_name: localstack-hub
    image: localstack/localstack:4.4.0
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=${SERVICES:-s3,sqs,sns,dynamodb,lambda,secretsmanager,ssm,iam}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - PERSISTENCE=${PERSISTENCE:-1}
      - DEBUG=${DEBUG:-0}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "./init/ready.d:/etc/localstack/init/ready.d:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - aws-local-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    container_name: aws-local-dashboard
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - DASHBOARD_PORT=3000
    depends_on:
      - localstack
    networks:
      - aws-local-net

networks:
  aws-local-net:
    name: aws-local-net
    driver: bridge
